[build]
  publish = "."
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
[[headers]]
  for = "/IMG/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
[[redirects]]
  from = "/services"
  to = "/Services.html"
  status = 301
[[redirects]]
  from = "/portfolio"
  to = "/Portfolio_next.html"
  status = 301
[[redirects]]
  from = "/contact"
  to = "/site_form7.html"
  status = 301
