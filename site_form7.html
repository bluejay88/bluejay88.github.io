<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Begin a Project — Anchor</title><link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&family=Manrope:wght@300;400;500;600&display=swap" rel="stylesheet"><link rel="stylesheet" href="CSS/executive.css"><style>.brief{display:grid;grid-template-columns:.8fr 1.2fr;gap:9vw;align-items:start;padding-top:150px}.brief h1{font:500 clamp(48px,7vw,102px)/.98 var(--serif);margin:0}.brief-copy{position:sticky;top:140px}.brief-form{display:grid;grid-template-columns:1fr 1fr;gap:26px 18px}.field{display:flex;flex-direction:column;gap:9px}.field.full{grid-column:1/-1}.field label{font-size:9px;text-transform:uppercase;letter-spacing:.2em;color:var(--gold)}.field input,.field select,.field textarea{border:0;border-bottom:1px solid #4c493f;background:transparent;color:var(--ivory);padding:12px 0;font:14px var(--sans);border-radius:0;outline:none}.field select option{background:#111}.field textarea{min-height:105px;resize:vertical}.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--gold)}.privacy{font-size:10px;line-height:1.6;color:#777164}.form-status{grid-column:1/-1;color:var(--gold);min-height:20px;font-size:12px}.brief-form .button{justify-self:start}.honeypot{position:absolute;left:-9999px}@media(max-width:760px){.brief{display:block}.brief-copy{position:static;margin-bottom:55px}.brief-form{grid-template-columns:1fr}}</style></head><body><header class="site-header scrolled"><a class="mark" href="index.html"><span>A</span><small>Anchor</small></a><nav><a href="Services.html">Capabilities</a><a href="index.html">Home</a></nav></header><main><section class="panel brief"><div class="brief-copy reveal"><p class="eyebrow">Private project inquiry</p><h1>Enter the<br><em>strategy room.</em></h1><p class="lede">Tell us enough to make the first conversation matter. We review every serious inquiry personally.</p></div><form id="lead-form" class="brief-form reveal" novalidate><div class="honeypot"><label>Website<input name="website" tabindex="-1" autocomplete="off"></label></div><div class="field"><label for="name">Your name *</label><input id="name" name="name" required autocomplete="name"></div><div class="field"><label for="email">Work email *</label><input id="email" name="email" type="email" required autocomplete="email"></div><div class="field"><label for="company">Organization</label><input id="company" name="company" autocomplete="organization"></div><div class="field"><label for="phone">Telephone</label><input id="phone" name="phone" type="tel" autocomplete="tel" placeholder="Any international format"></div><div class="field full"><label for="service">Primary ambition *</label><select id="service" name="service" required><option value="">Choose a capability</option><option>Digital Flagship</option><option>AI Systems</option><option>Project Operations</option><option>AI Training</option><option>Brand & Growth</option><option>Not certain yet</option></select></div><div class="field"><label for="budget">Investment range *</label><select id="budget" name="budget" required><option value="">Select range</option><option>$5k–$15k</option><option>$15k–$40k</option><option>$40k–$100k</option><option>$100k+</option></select></div><div class="field"><label for="timeline">Target window</label><select id="timeline" name="timeline"><option>Within 30 days</option><option>This quarter</option><option>3–6 months</option><option>Exploring options</option></select></div><div class="field full"><label for="brief">What must change? *</label><textarea id="brief" name="brief" required minlength="20" placeholder="The current state, desired outcome, and what is at stake…"></textarea></div><label class="privacy full"><input type="checkbox" name="consent" required> I agree that Anchor may use this information to evaluate and respond to my inquiry. No sale of personal information.</label><p class="form-status" role="status"></p><button class="button" type="submit">Submit private brief ↗</button></form></section></main><script src="JS/executive.js"></script><script>const form=document.getElementById('lead-form'),status=document.querySelector('.form-status');const requested=new URLSearchParams(location.search).get('service');if(requested)form.service.value=requested;form.addEventListener('submit',e=>{e.preventDefault();if(form.website.value)return;if(!form.checkValidity()){form.reportValidity();status.textContent='Please complete each required field.';return}const data=Object.fromEntries(new FormData(form));delete data.website;delete data.consent;const lead={id:'lead_'+Date.now(),createdAt:new Date().toISOString(),source:'Private inquiry',status:'New',score:data.budget==='$100k+'?95:data.budget==='$40k–$100k'?85:70,...data};const leads=JSON.parse(localStorage.getItem('anchor_leads')||'[]');leads.unshift(lead);localStorage.setItem('anchor_leads',JSON.stringify(leads));status.textContent='Your brief is secured in this browser. Redirecting…';form.reset();setTimeout(()=>location.href='thanks.html',900)});</script></body></html>
